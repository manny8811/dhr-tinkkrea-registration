<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHR TinkKrea Build, Code, Battle - Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --accent: #ea580c;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .container {
      background: var(--card-bg);
      border-radius: 16px;
      max-width: 580px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: #eff6ff;
      color: var(--primary);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; line-height: 1.3; }
    p.subtitle { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
    .full-width { grid-column: span 2; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #f8fafc;
      transition: all 0.2s ease;
    }
    input:focus { outline: none; border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12); }
    input[readonly] { background: #e2e8f0; color: #475569; cursor: not-allowed; font-weight: 600; }
    
    .payment-box {
      background: #fff7ed;
      border: 1.5px dashed var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-top: 22px;
      text-align: center;
    }
    .payment-title { font-size: 13px; font-weight: 700; color: #9a3412; text-transform: uppercase; letter-spacing: 0.5px; }
    .fee-tag { font-size: 28px; font-weight: 800; color: #ea580c; margin: 6px 0; }
    .qr-container { margin: 10px auto; display: inline-block; padding: 8px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .qr-container img { display: block; width: 140px; height: 140px; }
    .upi-info { font-size: 12.5px; color: #7c2d12; margin-top: 4px; font-weight: 500; }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 22px;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #msg { text-align: center; font-size: 14px; font-weight: 600; margin-top: 14px; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
    .brand-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}
.brand-header img.logo-tinkkrea {
  height: 58px;
  width: auto;
  object-fit: contain;
}
.brand-header img.logo-tii {
  height: 48px;
  width: auto;
  object-fit: contain;
}
.brand-divider {
  width: 1.5px;
  height: 40px;
  background-color: #cbd5e1;
}
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <!-- Brand Logos -->
    <div class="brand-header">
      <img src="tinkkrea-logo.png" alt="TinkKrea Logo" class="logo-tinkkrea">
      <div class="brand-divider"></div>
      <img src="tii-logo.png" alt="TII Logo" class="logo-tii">
    </div>

    <span class="badge">DHR Ghoom Festival: BUILD|CODE|BATTLE </span>
    <h1>TinkKrea Build, Code, Battle</h1>
    <p class="subtitle">Enter candidate details and submit transaction details</p>
  </div>

  <form id="regForm">
    <div class="form-grid">
      <div class="full-width">
        <label>Candidate Full Name *</label>
        <input type="text" id="candidateName" required placeholder="e.g. Aayush Sharma">
      </div>

      <div>
        <label>Date of Birth *</label>
        <input type="date" id="dob" required>
      </div>

      <div>
        <label>Age (Auto-calculated)</label>
        <input type="number" id="age" readonly placeholder="Auto">
      </div>

      <div class="full-width">
        <label>School / Institution Name *</label>
        <input type="text" id="schoolName" required placeholder="e.g. St. Teresa School">
      </div>

      <div>
        <label>Candidate Phone Number *</label>
        <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="10-digit mobile">
      </div>

      <div>
        <label>Candidate Email ID *</label>
        <input type="email" id="email" required placeholder="candidate@example.com">
      </div>

      <div>
        <label>Guardian Name *</label>
        <input type="text" id="guardianName" required placeholder="Parent / Guardian">
      </div>

      <div>
        <label>Guardian Phone Number *</label>
        <input type="tel" id="guardianPhone" pattern="[0-9]{10}" required placeholder="10-digit mobile">
      </div>
    </div>

    <!-- Payment section -->
    <div class="payment-box">
      <div class="payment-title">Registration Fee</div>
      <div class="fee-tag">₹500</div>
      <div class="qr-container">
        <!-- REPLACE 'your-upi-id@okaxis' with your actual VPA -->
        <img id="upiQr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=link2tii@okicici%26pn=TinkKrea%26am=500%26tn=DHR_BuildCodeBattle" alt="UPI QR Code">
      </div>
      <p class="upi-info">Scan to pay ₹500 OR Use the UPI ID: link2tii@okicici OR use the UPI Number: 8900675570 </p>
      
      <div style="margin-top: 14px; text-align: left;">
        <label style="color: #7c2d12;">UPI Reference No. / UTR / Transaction ID *</label>
        <input type="text" id="txnId" required placeholder="12-digit UTR or Transaction ID" style="background: white;">
      </div>
    </div>

    <button type="submit" id="submitBtn">Submit Registration</button>
    <div id="msg"></div>
  </form>
</div>

<script>
  // REPLACE with your deployed Apps Script URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLGwo2i9iaroeFl6eyphSY0QKXpRFyer6Tr0EGWYedr-YPcbYoWU2mo4xS1k6IIx7gHQ/exec";

  // Auto-calculate exact age from Date of Birth
  const dobInput = document.getElementById('dob');
  const ageInput = document.getElementById('age');

  dobInput.addEventListener('change', () => {
    if (!dobInput.value) return;
    const birthDate = new Date(dobInput.value);
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
      age--;
    }
    ageInput.value = age >= 0 ? age : 0;
  });

  // Handle Form Submission
  const form = document.getElementById('regForm');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";
    msg.innerText = "";

    const payload = {
      candidateName: document.getElementById('candidateName').value.trim(),
      dob: dobInput.value,
      age: ageInput.value,
      schoolName: document.getElementById('schoolName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      guardianName: document.getElementById('guardianName').value.trim(),
      guardianPhone: document.getElementById('guardianPhone').value.trim(),
      txnId: document.getElementById('txnId').value.trim()
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      msg.className = "success";
      msg.innerText = "Registration submitted successfully! Your ticket will be emailed once payment is verified.";
      form.reset();
      ageInput.value = "";
    } catch (err) {
      msg.className = "error";
      msg.innerText = "Submission failed. Please check your network connection and try again.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Registration";
    }
  });
</script>

</body>
</html>
